# Build server/ into ghcr.io/bernarduriza/cristal.cli/api and roll it into the Container App.
# Auth: OIDC federated credential repo:BernardUriza/cristal.cli:ref:refs/heads/main on the shared AAD app.
# The Container App carries its env/secrets out-of-band (AIRE_GATE_URL, AIRE_AUTH_TOKEN, SUSURRO_KEY, CRISTAL_ALLOWED_ORIGINS).
name: Deploy API to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/azure-container-apps.yml"
  workflow_dispatch:

concurrency:
  group: aca-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}/api

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    env:
      DEPLOY_CONFIGURED: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_CONTAINER_APP_NAME != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: img
        run: |
          IMG_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMG_LOWER}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMG_LOWER}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.image }}
            ${{ steps.img.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        if: ${{ env.DEPLOY_CONFIGURED == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App revision
        if: ${{ env.DEPLOY_CONFIGURED == 'true' }}
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.img.outputs.image }}" \
            --output none
          echo "Rolled ${{ vars.AZURE_CONTAINER_APP_NAME }} to ${{ steps.img.outputs.image }}"

      - name: Wait for the NEW revision to run (the old one keeps answering /health while the new one crashes)
        if: ${{ env.DEPLOY_CONFIGURED == 'true' }}
        run: |
          APP="${{ vars.AZURE_CONTAINER_APP_NAME }}"; RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          REV=$(az containerapp show --name "$APP" --resource-group "$RG" --query "properties.latestRevisionName" -o tsv)
          echo "Latest revision: $REV"
          for i in $(seq 1 36); do
            STATE=$(az containerapp revision show --name "$APP" --resource-group "$RG" --revision "$REV" --query "properties.runningState" -o tsv 2>/dev/null || echo "Unknown")
            IMAGE=$(az containerapp revision show --name "$APP" --resource-group "$RG" --revision "$REV" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "?")
            echo "  attempt $i: $REV image=$IMAGE state=$STATE"
            case "$STATE" in
              Running|RunningAtMaxScale)
                [ "$IMAGE" = "${{ steps.img.outputs.image }}" ] || { echo "FAIL — running revision carries another image."; exit 1; }
                echo "OK — $REV runs the pushed image."; exit 0;;
              Failed|Degraded)
                echo "FAIL — revision $REV is $STATE. Console log tail:"
                az containerapp logs show --name "$APP" --resource-group "$RG" --revision "$REV" --type console --tail 40 || true
                exit 1;;
            esac
            sleep 5
          done
          echo "FAIL — revision $REV never reached Running."
          exit 1

      - name: Smoke /health
        if: ${{ env.DEPLOY_CONFIGURED == 'true' }}
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://$FQDN/health" || echo "000")
          echo "https://$FQDN/health → HTTP $code"
          [ "$code" = "200" ]
