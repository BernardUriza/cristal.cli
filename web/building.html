<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRISTAL.CLI — edificio computacional</title>
    <style>
      :root { --bg: #0b0b12; --fg: #f1e6c8; --dim: #8a7f66; --accent: #33ff99; --paper: #f3e7c6; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 "JetBrains Mono", Consolas, monospace; }
      #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
      header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #222; }
      header label { display: flex; gap: 8px; align-items: center; }
      header input[type="range"] { width: 220px; }
      header button { background: transparent; color: var(--fg); border: 1px solid var(--dim); padding: 4px 10px; font: inherit; cursor: pointer; }
      header button.active { border-color: var(--accent); color: var(--accent); }
      #report { color: var(--dim); }
      #report.bad { color: #ff5577; }
      main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
      #sheets { display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 8px; padding: 8px; overflow: auto; }
      #sheets figure { background: var(--paper); }
      #sheets figcaption { color: #1a1412; font-size: 12px; padding: 4px 8px; background: #e6d5ab; }
      #sheets svg { width: 100%; height: auto; display: block; }
      #three { position: relative; min-height: 0; }
      #three canvas { display: block; width: 100%; height: 100%; }
      #hint { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; }
      @media (max-width: 1000px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <strong>claustro-minimo</strong>
        <label>puerta sala-n1 ↔ gal-n <input id="door" type="range" min="0.1" max="0.9" step="0.01" value="0.5" /> <span id="door-value">0.50</span></label>
        <span>vista 3D:</span>
        <button data-view="orbit" class="active">navegar</button>
        <button data-view="plan">planta</button>
        <button data-view="front">alzado</button>
        <button data-view="section">sección</button>
        <button data-view="isometric">isométrica</button>
        <span id="report"></span>
      </header>
      <main>
        <section id="sheets"></section>
        <section id="three"><div id="hint">arrastra para orbitar · rueda para acercar</div></section>
      </main>
    </div>
    <script type="module" src="/src/building/main.ts"></script>
  </body>
</html>
