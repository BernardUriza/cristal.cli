id: psilocibina
nombres: [psilocibina, psilocina, hongos, hongos mágicos, hongos magicos, hongos psilocibios, magic mushrooms, honguitos, derrumbe, derrumbes]
familia: psicodelico-clasico
identidad:
  quimica: "psilocibina (4-fosforiloxi-N,N-dimetiltriptamina), presente en ciertos hongos; tras ingerirse el cuerpo la convierte en psilocina, el metabolito activo"
  fuentes: [nida-psilocybin-2024, nccih-psilocybin-2024]
mecanismo:
  texto: "la psilocina actúa sobre receptores de serotonina, sobre todo el 5-HT2A; se cree que esto explica buena parte de la experiencia subjetiva y altera la comunicación entre regiones cerebrales, incluida la red por defecto"
  limites: "NIDA lo plantea como lo que los investigadores creen; los efectos dependen de la dosis, la biología e historia de la persona, su expectativa (set) y el entorno (setting), y NCCIH subraya que son difíciles de predecir y varían mucho entre personas"
  fuentes: [nida-psilocybin-2024, nccih-psilocybin-2024]
temporalidad:
  inicio: [20, 40]
  pico: [60, 90]
  duracion: [180, 360]
  limites: "punto débil de la ficha: los rangos vienen de una guía en preprint (que cita a Brown 2017 y Hasler 1997) y del resumen de Passie 2002; no se pudo abrir el texto completo de ninguna; confianza baja a media, falta reconfirmar con Brown 2017"
  fuentes: [glennon-2025, passie-2002]
efectos:
  - { tipo: perceptivo, texto: "percepción alterada: ver colores o formas, oír cosas que no están, perder la noción del tiempo y del espacio", fuentes: [nida-psilocybin-2024] }
  - { tipo: emocional, texto: "emociones intensas y cambiantes, de la dicha al terror; el ánimo puede ser lábil durante la fase aguda", fuentes: [nida-psilocybin-2024, griffiths-2006] }
  - { tipo: cognitivo, texto: "experiencias de tipo místico, con sensación de ausencia de límites del yo", fuentes: [nida-psilocybin-2024, griffiths-2006] }
  - { tipo: fisico, texto: "aumento típico de la presión arterial y la frecuencia cardiaca", fuentes: [nida-psilocybin-2024, johnson-2008, yerubandi-2024] }
  - { tipo: fisico, texto: "náusea, mareo y dolor de cabeza frecuentes en la fase aguda; en ensayos clínicos se resolvieron en un máximo de 48 horas", fuentes: [yerubandi-2024, nccih-psilocybin-2024] }
  - { tipo: fisico, texto: "agitación, confusión y vómito que puede ser intenso", fuentes: [nida-psilocybin-2024] }
riesgos:
  - { texto: "ansiedad, pánico o paranoia durante la experiencia (mal viaje); es la reacción adversa más probable", gravedad: moderada, fuentes: [nida-psilocybin-2024, nccih-psilocybin-2024, johnson-2008] }
  - { texto: "juicio y conciencia alterados que llevan a conductas de riesgo, sobre todo sin acompañamiento; el pánico puede empujar a la persona a irse del lugar seguro", gravedad: grave, fuentes: [nida-psilocybin-2024, johnson-2008] }
  - { texto: "confundir hongos tóxicos con hongos con psilocibina puede causar envenenamiento mortal; NIDA recoge además que productos comerciales contaminados se han vinculado a enfermedad grave", gravedad: grave, fuentes: [nida-psilocybin-2024, nccih-psilocybin-2024] }
  - { texto: "psicosis persistente, sobre todo en personas con enfermedad mental previa o antecedentes familiares de trastornos psicóticos o bipolares", gravedad: grave, fuentes: [nccih-psilocybin-2024, johnson-2008] }
  - { texto: "la subida de presión arterial y frecuencia cardiaca puede ser peligrosa para quien tiene una condición cardiaca", gravedad: moderada, fuentes: [nida-psilocybin-2024] }
  - { texto: "trastorno persistente de la percepción por alucinógenos (HPPD): muy poco frecuente, descrito con menos frecuencia en investigación que en uso recreativo", gravedad: moderada, fuentes: [johnson-2008] }
  - { texto: "mareo, náusea y dolor de cabeza durante unas horas", gravedad: leve, fuentes: [yerubandi-2024] }
senales_de_urgencia:
  - { texto: "síntomas graves o peligro inmediato (agitación intensa, confusión marcada, vómito severo, conducta que pone en riesgo a la persona o a otros): llamar a emergencias (en México, 911) o ir a urgencias", fuentes: [nida-psilocybin-2024] }
  - { texto: "se comió un hongo que no estaba identificado con certeza, o hay náusea, vómito y diarrea intensos tras comer hongos: llamar ya a emergencias o a un centro de toxicología", fuentes: [nida-psilocybin-2024, nccih-psilocybin-2024, utah-poison-2024] }
  - { texto: "ideas de hacerse daño o de suicidio, antes o después de la experiencia: buscar ayuda inmediata (en México, Línea de la Vida 800 911 2000)", fuentes: [nida-psilocybin-2024, goodwin-2022] }
  - { texto: "alucinaciones, delirios o ideas de persecución que persisten cuando el efecto agudo ya debió pasar (psicosis persistente)", fuentes: [nccih-psilocybin-2024, johnson-2008] }
investigacion:
  - { texto: "ensayo con lista de espera en trastorno depresivo mayor: 27 personas aleatorizadas, 24 completaron las evaluaciones; la depresión bajó mucho en el grupo inmediato frente al diferido con psicoterapia de apoyo. Límites: muestra pequeña, un solo centro, control por lista de espera (no ciego); aplica a terapia con acompañamiento, no a consumo por cuenta propia", tipo: ensayo, poblacion: "adultos con trastorno depresivo mayor, Johns Hopkins Bayview, n=27", fuentes: [davis-2021] }
  - { texto: "ensayo fase 2 doble ciego en depresión resistente al tratamiento: 233 personas; frente al control la dosis alta mejoró la escala MADRS a la semana 3 y la dosis media no alcanzó significancia. 77 % tuvo eventos adversos (cefalea, náusea, mareo) y hubo ideación o conducta suicida o autolesión en todos los grupos. Límites: una sola administración, seguimiento corto, población clínica con apoyo psicológico", tipo: ensayo, poblacion: "adultos con depresión resistente al tratamiento, multicéntrico, n=233", fuentes: [goodwin-2022] }
  - { texto: "evidencia citada por NCCIH (alcohol, ansiedad en enfermedad grave, depresión): estudios de 59, 93 y 104 personas y un análisis de 117 con cáncer; en el estudio de alcohol casi todos adivinaron qué tratamiento recibieron; no hay certeza del beneficio duradero. El diseño, el tamaño y el estado de salud de los participantes limitan las conclusiones", tipo: revision, poblacion: "personas con trastorno por consumo de alcohol, depresión o angustia por enfermedad grave", fuentes: [nccih-psilocybin-2024] }
  - { texto: "metaanálisis de efectos adversos agudos con psilocibina en depresión o ansiedad (6 ensayos doble ciego, 528 participantes): más náusea, mareo, ansiedad, presión arterial elevada y cefalea que el control; sin asociación con paranoia; descrito como tolerable y resuelto en 48 horas. Límites: dosis única terapéutica, población seleccionada", tipo: revision-sistematica, poblacion: "adultos de ensayos aleatorizados por depresión o ansiedad", fuentes: [yerubandi-2024] }
  - { texto: "estudio doble ciego cruzado en voluntarios sanos con práctica espiritual regular (n=30): la psilocibina aumentó las medidas de experiencia mística y a los 2 meses se calificó como de significado personal duradero. Límites: muestra pequeña y muy seleccionada, laboratorio con preparación y apoyo", tipo: ensayo, poblacion: "30 voluntarios sanos con práctica religiosa o espiritual regular", fuentes: [griffiths-2006] }
  - { texto: "marco regulatorio: la FDA publicó en julio de 2026 la guía definitiva sobre investigación clínica con psicodélicos; orienta a patrocinadores y no es una autorización de uso. Según NCCIH, la FDA dio designación de terapia innovadora a terapia asistida con psilocibina en depresión resistente (2018) y trastorno depresivo mayor (2019)", tipo: revision, poblacion: "no aplica (marco regulatorio)", fuentes: [fda-psychedelics-2026, nccih-psilocybin-2024] }
  - { texto: "microdosis: la investigación hasta hoy no ha establecido que sea segura ni eficaz; NCCIH menciona posibles desventajas como insomnio, ansiedad, baja energía y mala concentración", tipo: revision, poblacion: "uso no clínico, sin población definida", fuentes: [nida-psilocybin-2024, nccih-psilocybin-2024] }
fenomenologia:
  - { texto: "experiencia de tipo místico en entorno de investigación: unidad, carácter noético, sacralidad, trascendencia del tiempo y del espacio, inefabilidad y ánimo positivo; el cuestionario MEQ-30 mide cuatro factores. Es lo reportado, no universal", fuentes: [macLean-2012, griffiths-2006] }
  - { texto: "en la fase aguda se describen cambios perceptivos y ánimo lábil, que pueden alternar entre gozo y miedo", fuentes: [griffiths-2006, nida-psilocybin-2024] }
  - { texto: "pérdida de la noción del tiempo y del espacio y sensación de ausencia de límites del yo; algunas personas lo viven como expansión y otras como desorientación o amenaza", fuentes: [nida-psilocybin-2024, macLean-2012] }
acompanamiento:
  - { texto: "no pasar la experiencia a solas: los protocolos de investigación indican que la persona no debe quedar sola; NIDA señala que el riesgo de conductas peligrosas aumenta sin supervisión", fuentes: [johnson-2008, nida-psilocybin-2024] }
  - { texto: "entorno tranquilo, parecido a una sala doméstica, sin objetos con los que se pueda uno lastimar; la primera respuesta ante la angustia es la tranquilización verbal", fuentes: [johnson-2008] }
  - { texto: "si aparece pánico o miedo intenso, acompañar con calma y tranquilizar; si hay síntomas graves o peligro inmediato, pasar a urgencias", fuentes: [johnson-2008, nida-psilocybin-2024] }
  - { texto: "después de la experiencia, hablar al día siguiente con una persona de confianza o un profesional y vigilar si persisten alteraciones de la percepción", fuentes: [johnson-2008] }
contradicciones:
  - { texto: "adicción: NIDA indica que la psilocibina no suele llevar a la adicción; el resumen de Passie 2002 habla de una creciente capacidad de abuso. Pesa más NIDA por reciente y oficial, pero no está cerrado", fuentes: [nida-psilocybin-2024, passie-2002] }
  - { texto: "seguridad en contexto: la revisión de ensayos describe efectos adversos tolerables y resueltos en 48 horas, mientras NIDA advierte que los malos resultados pueden ser más probables fuera de entornos clínicos; los ensayos seleccionan y preparan a los participantes", fuentes: [yerubandi-2024, nida-psilocybin-2024] }
  - { texto: "toxicidad: NCCIH afirma que puede causar la muerte con dosis muy altas; Johnson 2008 describe baja toxicidad fisiológica. La causa principal de daño grave documentada en las fuentes leídas es confundir el hongo con uno tóxico", fuentes: [nccih-psilocybin-2024, johnson-2008] }
  - { texto: "eficacia clínica: Davis 2021 concluye que es eficaz en depresión mayor; NCCIH dice que no hay evidencia suficiente para estar seguro del beneficio duradero; en Goodwin 2022 la dosis media no alcanzó significancia. Evidencia preliminar, no tratamiento establecido", fuentes: [davis-2021, nccih-psilocybin-2024, goodwin-2022] }
  - { texto: "daño hepático por hongos: Utah alertó en dic 2024 de un posible caso por amatoxinas tras hongos psicodélicos de la calle; en abr 2025 actualizó que los hongos no fueron responsables. No se usa como evidencia de daño por psilocibina", fuentes: [utah-poison-2024] }
