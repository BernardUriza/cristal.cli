id: mdma
nombres: [MDMA, 3,4-metilendioximetanfetamina, éxtasis, extasis, molly, tacha, tachas]
familia: empatogeno
identidad:
  quimica: "3,4-metilendioximetanfetamina; droga sintética con efectos similares a estimulantes como la metanfetamina"
  fuentes: [nida-mdma-2024]
mecanismo:
  texto: "libera y/o bloquea la recaptura de serotonina, dopamina y noradrenalina, con lo que sube su nivel en el cerebro; además aumenta la secreción de arginina vasopresina"
  limites: "las fuentes leídas describen la acción sobre neurotransmisores, no explican por qué la experiencia subjetiva varía entre personas ni contextos"
  fuentes: [nida-mdma-2024, msd-mdma-2026]
temporalidad:
  inicio: [30, 60]
  pico: null
  duracion: [180, 360]
  fuentes: [nida-mdma-2024, msd-mdma-2026]
efectos:
  - { tipo: emocional, texto: "puede dar sensación de felicidad, energía, alerta y cercanía con otras personas", fuentes: [nida-mdma-2024] }
  - { tipo: perceptivo, texto: "mayor sensibilidad a vistas, sonidos, tacto y olores", fuentes: [nida-mdma-2024] }
  - { tipo: fisico, texto: "sube la presión arterial; puede haber apretar la mandíbula sin querer, náusea, vómito e inquietud en las piernas", fuentes: [nida-mdma-2024] }
  - { tipo: fisico, texto: "una sola toma aumenta la frecuencia cardíaca, la presión, la temperatura corporal y el tamaño de la pupila", fuentes: [msd-mdma-2026] }
  - { tipo: cognitivo, texto: "altera el ánimo, la sensación, la sugestionabilidad y la cognición, y puede deteriorar la capacidad de percibir y predecir el movimiento; los efectos subjetivos pueden durar varias horas y dejar a la persona en un estado vulnerable", fuentes: [fda-adcom-briefing-2024] }
riesgos:
  - { texto: "hipertermia: subida peligrosa de la temperatura corporal (hiperpirexia), más probable con actividad física intensa o ambientes cálidos; más de 40 °C es el mejor predictor de mortalidad tras MDMA; el alcohol junto con MDMA aumenta el riesgo de hipertermia y deshidratación", gravedad: grave, fuentes: [nida-mdma-2024, msd-mdma-2026, vanamsterdam-alcohol-2021, samhsa-dawn-ecstasy-2013] }
  - { texto: "hiponatremia por sobrehidratación: la MDMA aumenta la vasopresina y, con mucho líquido hipotónico (agua) y pérdidas por sudor, puede aparecer hiponatremia hipoosmolar", gravedad: grave, fuentes: [msd-mdma-2026, vanamsterdam-alcohol-2021] }
  - { texto: "cardiovascular: sube la presión y el pulso; la toxicidad puede incluir taquiarritmias, de taquicardia sinusal a taquicardia ventricular; el uso prolongado se asocia a problemas del corazón o daño hepático", gravedad: moderada, fuentes: [msd-mdma-2026, fda-adcom-briefing-2024, nida-mdma-2024] }
  - { texto: "bajón de los días posteriores: caída del bienestar mental en los tres días siguientes al consumo, a la que contribuyen el sueño, el uso de cocaína y la ansiedad o depresión de base; SAMHSA describe ansiedad y confusión que pueden durar 1 semana o más", gravedad: moderada, fuentes: [blankers-3dias-2025, samhsa-dawn-ecstasy-2013, nida-mdma-2024] }
  - { texto: "adulteración: lo vendido como MDMA puede contener otras sustancias sin que la persona lo sepa (ketamina, anfetamina, catinonas sintéticas, MDA, metanfetamina, cafeína, DXM); NIDA señala presencia creciente de fentanilo ilícito en el suministro de drogas", gravedad: grave, fuentes: [nida-mdma-2024, msd-mdma-2026] }
senales_de_urgencia:
  - { texto: "temperatura corporal muy alta (el umbral clínico de mortalidad es sobre 40 °C), con agitación o confusión: buscar atención médica ya", fuentes: [msd-mdma-2026, nida-mdma-2024, tao-serotoninergico-2017] }
  - { texto: "convulsiones", fuentes: [msd-mdma-2026, tao-serotoninergico-2017] }
  - { texto: "latido muy acelerado o irregular que no cede, o agitación intensa con presión muy alta", fuentes: [msd-mdma-2026, fda-adcom-briefing-2024] }
investigacion:
  - { texto: "MAPP1, fase 3 aleatorizado, doble ciego, controlado con placebo: 90 adultos con TEPT grave; MDMA más terapia manualizada redujo la puntuación CAPS-5 y la discapacidad funcional frente a placebo más terapia; los autores no reportaron eventos de abuso, suicidalidad ni prolongación del QT; límite: todos los brazos recibieron psicoterapia, así que no se separa el efecto del fármaco del de la terapia", tipo: ensayo, poblacion: "90 adultos con TEPT grave, entorno clínico con terapia manualizada", fuentes: [mapp1-2021, fda-adcom-briefing-2024] }
  - { texto: "MAPP2, fase 3 controlado con placebo: 104 adultos con TEPT de moderado a grave; evaluadores ciegos hallaron mayor reducción de síntomas (CAPS-5) y de deterioro funcional con MDMA más terapia; no se reportaron eventos adversos graves; límites: misma terapia en todos los brazos y desenmascaramiento funcional", tipo: ensayo, poblacion: "104 adultos con TEPT de moderado a grave, entorno clínico", fuentes: [mapp2-2023, fda-adcom-briefing-2024] }
  - { texto: "decisión de la FDA: el 9 de agosto de 2024 emitió una carta de respuesta completa a la solicitud de Lykos (MDMA con terapia para TEPT) y pidió otro ensayo fase 3; la carta no es pública. Las razones documentadas vienen del briefing de la FDA previo a la decisión: aproximadamente 90 por ciento de quienes recibieron fármaco y 75 por ciento de quienes recibieron placebo adivinaron su asignación (desenmascaramiento funcional) y hay posible sesgo de expectativa; cerca de 25 por ciento abandonó entre el estudio y el seguimiento; el perfil cardiaco no está bien caracterizado y la evaluación del QT es incompleta; hay pocos datos de laboratorio y de función hepática; faltan datos de abuso. La prensa añade que faltaban datos de seguridad y de potencial adictivo. En julio de 2026 la FDA finalizó su guía Psychedelic Drugs: Considerations for Clinical Investigations", tipo: revision, poblacion: "solicitud basada en MAPP1, MAPP2 y su seguimiento a largo plazo (MPLONG)", fuentes: [fda-adcom-briefing-2024, biospace-crl-2024, fda-guia-psicodelicos-2026] }
fenomenologia:
  - { texto: "testimonio: la empatía y la sociabilidad se describen como el efecto más notable y dominante de la experiencia, con euforia casi universal y una breve ansiedad inicial que suele reemplazarse por menos preocupación", fuentes: [psychonautwiki-mdma] }
  - { texto: "testimonio: el cuerpo se siente estimulado y agradable al tacto, con mandíbula apretada y temblores a veces intensos; el tiempo suele parecer pasar más rápido", fuentes: [psychonautwiki-mdma] }
  - { texto: "testimonio: la bajada se describe como incómoda frente al pico, con ánimo bajo, ansiedad, irritabilidad, fatiga mental y dolor de cabeza; algunas personas reportan un resplandor de bienestar seguido de una bajada más dura, y el ánimo bajo puede durar hasta una semana", fuentes: [psychonautwiki-mdma] }
acompanamiento:
  - { texto: "temperatura: un lugar fresco y ventilado y bajar el esfuerzo físico, porque la hipertermia se asocia a actividad física intensa y a ambientes cálidos", fuentes: [nida-mdma-2024, msd-mdma-2026] }
  - { texto: "agua con medida: reponer según sed y sudor, sin forzar grandes cantidades de agua sola; el exceso de líquido hipotónico junto con la vasopresina favorece la hiponatremia y el sudor intenso sin reposición favorece la deshidratación; las fuentes leídas no traen una cifra citable, por eso no se da; evitar alcohol", fuentes: [msd-mdma-2026, vanamsterdam-alcohol-2021] }
  - { texto: "descanso: priorizar dormir en los días siguientes y esperar un descenso de ánimo de hasta unos días, porque la calidad y duración del sueño contribuyen a la caída del bienestar posterior", fuentes: [blankers-3dias-2025, samhsa-dawn-ecstasy-2013] }
contradicciones:
  - { texto: "duración: NIDA da un promedio de 3 horas; Merck da 4 a 6 horas; el corpus guarda el rango 180 a 360 minutos", fuentes: [nida-mdma-2024, msd-mdma-2026] }
  - { texto: "seguridad cardíaca: MAPP1 reporta ausencia de eventos de prolongación del QT; la FDA dice que la evaluación del QT es incompleta y que los aumentos de presión y pulso fueron eventos de especial interés", fuentes: [mapp1-2021, fda-adcom-briefing-2024] }
  - { texto: "bajón: SAMHSA habla de efectos de ansiedad y confusión de una semana o más; el estudio de Blankers mide la caída de bienestar en una ventana de tres días y atribuye parte a sueño, cocaína y estado de ánimo de base; son ventanas distintas, no está cerrado cuánto dura", fuentes: [samhsa-dawn-ecstasy-2013, blankers-3dias-2025] }
  - { texto: "hipertermia en toxicidad serotoninérgica: Merck la presenta como la complicación más grave; en una serie de 52 pacientes con síndrome serotoninérgico solo apareció en 6 por ciento y lo más frecuente fue agitación psicomotora", fuentes: [msd-mdma-2026, tao-serotoninergico-2017] }
  - { texto: "hiponatremia: la ficha de NIDA no la menciona; Merck y la revisión de van Amsterdam sí", fuentes: [nida-mdma-2024, msd-mdma-2026, vanamsterdam-alcohol-2021] }
  - { texto: "eficacia clínica: los ensayos MAPP muestran mejora frente a placebo; la FDA considera que el desenmascaramiento funcional y el sesgo de expectativa limitan la interpretación y no pudo cuantificar su efecto", fuentes: [mapp1-2021, mapp2-2023, fda-adcom-briefing-2024] }
