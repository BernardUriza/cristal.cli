id: dmt
nombres: [DMT, N,N-dimetiltriptamina, dimetiltriptamina, ayahuasca, yagé, changa]
familia: triptamina
identidad:
  quimica: "N,N-dimetiltriptamina; indolalquilamina de la familia de las triptaminas, formada por sustitución de dos metilos en el nitrógeno terminal de la triptamina. Está presente en plantas sudamericanas y en preparaciones como la ayahuasca; también se produce sintéticamente."
  fuentes: [dea-dmt-2025, nida-psicodelicos-2026, unodc-triptaminas]
mecanismo:
  texto: "Los psicodélicos como el DMT actúan principalmente sobre receptores 5-HT2A y alteran temporalmente la comunicación entre regiones cerebrales. Por vía oral el DMT solo se degrada por la monoaminooxidasa y no produce efecto; la ayahuasca incluye alcaloides de la harmala (harmina, harmalina, tetrahidroharmina) que inhiben la MAO-A, y por eso el DMT oral sí llega al cerebro."
  limites: "La relación entre la actividad en el receptor y la experiencia subjetiva no está cerrada; la farmacocinética humana del DMT está caracterizada sólo de forma limitada y casi toda en administración intravenosa; los estudios toxicológicos de las triptaminas siguen siendo limitados."
  fuentes: [nida-psicodelicos-2026, dea-dmt-2025, brito-da-costa-2020, vanderheijden-2025, unodc-triptaminas]
temporalidad:
  - via: fumado-o-vaporizado
    inicio: [0, 1]
    pico: [2, 5]
    duracion: [30, 60]
    fuentes: [brito-da-costa-2020, davis-2020, dea-dmt-2025, timmermann-2019]
  - via: ayahuasca-oral
    inicio: [30, 30]
    pico: [90, 120]
    duracion: [240, 360]
    limites: "la única fuente da el inicio como unos 30 minutos"
    fuentes: [brito-da-costa-2020, davis-2020]
efectos:
  - { tipo: perceptivo, texto: "Alucinaciones visuales intensas y distorsiones auditivas, descritas en estudios clínicos con DMT intravenoso.", fuentes: [dea-dmt-2025] }
  - { tipo: cognitivo, texto: "Despersonalización y alteración del sentido del tiempo y de la imagen corporal.", fuentes: [dea-dmt-2025] }
  - { tipo: emocional, texto: "Miedo o ansiedad pueden aparecer; entre 2.561 personas que describieron un encuentro con entidades tras DMT inhalado, el 41 % reportó miedo durante el encuentro.", fuentes: [nida-psicodelicos-2026, davis-2020] }
  - { tipo: fisico, texto: "Aumento de la presión arterial y de la frecuencia cardíaca, agitación, pupilas dilatadas, nistagmo, mareo y ataxia (falta de coordinación muscular).", fuentes: [dea-dmt-2025] }
  - { tipo: fisico, texto: "Con ayahuasca son frecuentes náuseas, vómito, diarrea y agotamiento; la revisión los describe como transitorios, de uno o dos días.", fuentes: [brito-da-costa-2020] }
riesgos:
  - { texto: "Ayahuasca con ISRS u otros fármacos serotoninérgicos: los alcaloides de la harmala inhiben la MAO-A y la combinación puede producir síndrome serotoninérgico, potencialmente mortal. La revisión toxicológica pide evitar también litio, triptanes y levodopa junto con ayahuasca.", gravedad: grave, fuentes: [callaway-grob-1998, brito-da-costa-2020] }
  - { texto: "Los psicodélicos podrían desencadenar un cuadro tipo esquizofrenia en personas con predisposición; hay poca evidencia de problemas psiquiátricos duraderos en la mayoría. Un caso clínico documenta psicosis con lesiones y daños materiales tras ayahuasca en un paciente con esquizofrenia.", gravedad: grave, fuentes: [nida-psicodelicos-2026, bilhimer-2018] }
  - { texto: "Efectos psicológicos adversos como miedo o ansiedad, y efectos difíciles de predecir.", gravedad: moderada, fuentes: [nida-psicodelicos-2026, brito-da-costa-2020] }
  - { texto: "Los psicodélicos rara vez causan trastorno de percepción persistente por alucinógenos (HPPD), que puede reaparecer incluso años después; la fuente lo describe para psicodélicos en general, no para DMT en particular.", gravedad: moderada, fuentes: [nida-psicodelicos-2026] }
  - { texto: "Las drogas de fabricación ilícita pueden estar contaminadas con fentanilo, incoloro e inodoro.", gravedad: grave, fuentes: [nida-psicodelicos-2026] }
  - { texto: "Los alcaloides de la harmala en dosis altas (sobre todo harmalina por semillas de Peganum harmala) se asocian con convulsiones y parálisis respiratoria; se describen dos muertes con ayahuasca o alcaloides de la harmala sin causa anatómica hallada.", gravedad: grave, fuentes: [brito-da-costa-2020] }
senales_de_urgencia:
  - { texto: "Coma o paro respiratorio: según datos de centros de control de envenenamientos de EE. UU. se han asociado a exposiciones a DMT.", fuentes: [dea-dmt-2025] }
  - { texto: "Convulsiones tras DMT o tras ayahuasca.", fuentes: [dea-dmt-2025, brito-da-costa-2020] }
  - { texto: "Tras ayahuasca, agitación con clonus o hiperreflexia, o si la persona toma ISRS u otros fármacos serotoninérgicos: el caso clínico presentó clonus leve y reflejos aumentados, y la interacción con ISRS puede causar síndrome serotoninérgico.", fuentes: [bilhimer-2018, callaway-grob-1998] }
  - { texto: "Agitación o psicosis con riesgo de hacerse daño o dañar a otros, o frases suicidas, sobre todo con antecedentes psiquiátricos: el caso documentado requirió contención, atención de urgencias e ingreso psiquiátrico.", fuentes: [bilhimer-2018] }
investigacion:
  - { texto: "Estudio con DMT intravenoso, bolo seguido de infusión continua, que extendió la experiencia a unos 30 minutos; la ansiedad se mantuvo baja, la frecuencia cardíaca se habituó en 15 minutos y los efectos psicológicos hicieron meseta (tolerancia aguda). Muestra pequeña y vía intravenosa, no fumada.", tipo: ensayo, poblacion: "11 voluntarios", fuentes: [luan-2024] }
  - { texto: "Estudio con DMT intravenoso en bolo (cruzado, placebo) y una rama de escalada abierta: los efectos alcanzaron su máximo en unos 2 minutos y cedieron en 12 a 30 minutos; hubo un techo de efecto sin tolerancia; la escalada abierta fue mejor tolerada y con calificaciones menos intensas, lo que sugiere que el cegamiento y la expectativa moldean la experiencia. No generaliza a la vía fumada ni al consumo fuera de laboratorio.", tipo: ensayo, poblacion: "20 participantes en el cruzado y 16 en la escalada abierta", fuentes: [erne-2026] }
  - { texto: "Ensayo de factibilidad de prueba de concepto con una sola toma de ayahuasca y seguimiento de 3 meses: reducciones de síntomas depresivos y de ansiedad que duraron unas 3 semanas, sin eventos adversos graves; sin grupo control, así que no permite concluir eficacia.", tipo: ensayo, poblacion: "6 mujeres con diagnóstico de cáncer", fuentes: [maekawa-2026] }
  - { texto: "Revisión sistemática de farmacocinética humana: 13 publicaciones y 8 conjuntos de datos, casi todos con DMT intravenoso y uno intramuscular; eliminación rápida y bifásica con vida media terminal de unos 4,8 a 19 minutos; los autores concluyen que la farmacocinética está caracterizada sólo en parte.", tipo: revision-sistematica, poblacion: "voluntarios sanos de los estudios incluidos", fuentes: [vanderheijden-2025] }
fenomenologia:
  - { texto: "fenomenología: encuentros con entidades o presencias aparentemente autónomas tras DMT inhalado: los sentidos principales fueron visual y extrasensorial (p. ej. telepático); las etiquetas más comunes fueron ser, guía, espíritu, alienígena y ayudante; las emociones más prominentes atribuidas fueron amor, bondad y alegría. Es autorreporte de una encuesta en línea, no se presenta como universal; los autores advierten que puede subestimar los efectos dañinos porque quienes tuvieron malas experiencias pudieron participar menos.", fuentes: [davis-2020] }
  - { texto: "fenomenología: ruptura del tiempo: la literatura clínica describe un sentido del tiempo alterado y distorsiones perceptivas y temporales con DMT intravenoso o inhalado; son descripciones recogidas en estudios, no una medición del tiempo vivido de cada persona.", fuentes: [dea-dmt-2025, davis-2020] }
  - { texto: "fenomenología: imaginería visual inusualmente vívida con los ojos cerrados; en el estudio de EEG con DMT intravenoso, la emergencia de oscilaciones delta y theta se correlacionó con el pico de la experiencia, en particular con su componente visual de ojos cerrados. Las entidades no se evaluaron en ese estudio.", fuentes: [timmermann-2019] }
acompanamiento:
  - { texto: "Saber que el efecto del DMT fumado es muy breve y que suele resolverse en 30 a 45 minutos ayuda a situar lo que se vive; con ayahuasca el proceso dura horas, de 4 a 6 según la revisión. No hay en las fuentes leídas ensayos sobre técnicas de grounding específicas para DMT.", fuentes: [dea-dmt-2025, brito-da-costa-2020] }
  - { texto: "En el estudio intravenoso, la escalada abierta fue mejor tolerada que la ciega, lo que apunta a que la expectativa y el contexto influyen en cómo se vive el pico; entender que lo que ocurre es esperable en la sustancia puede restar miedo. Es un hallazgo de laboratorio, no una guía de actuación.", fuentes: [erne-2026] }
  - { texto: "Los síntomas digestivos tras ayahuasca son transitorios, de uno o dos días; si hay agitación intensa, convulsiones, psicosis o medicación serotoninérgica de por medio, no es caso de acompañamiento en casa sino de atención médica.", fuentes: [brito-da-costa-2020, bilhimer-2018, callaway-grob-1998] }
contradicciones:
  - { texto: "Duración del DMT fumado o inhalado: una fuente dice que se resuelve en menos de 30 minutos, otra que generalmente en 30 a 45 y otra que dura menos de 60; el rango [30, 60] los cubre y depende de la dosis y de la persona.", fuentes: [davis-2020, dea-dmt-2025, brito-da-costa-2020] }
  - { texto: "Valencia de los encuentros con entidades: la encuesta reporta emociones predominantemente positivas (amor, bondad, alegría) y a la vez 41 % de miedo; los propios autores señalan sesgo de autoselección que puede subestimar lo negativo.", fuentes: [davis-2020] }
  - { texto: "Efectos persistentes: la fuente oficial dice que los psicodélicos rara vez causan HPPD y que hay poca evidencia de daño psiquiátrico duradero en la mayoría, pero también que pueden desencadenar cuadros psicóticos con predisposición; ambas afirmaciones conviven y dependen de la vulnerabilidad previa.", fuentes: [nida-psicodelicos-2026] }
  - { texto: "La vía de administración condiciona casi toda la evidencia: los ensayos clínicos usan DMT intravenoso y los datos de ayahuasca vienen de otros contextos; ninguna fuente leída da farmacocinética humana del DMT fumado.", fuentes: [vanderheijden-2025, erne-2026, luan-2024] }
