id: cafeina
nombres: [cafeína, cafeina, café, bebida energética, bebidas energéticas, energizante, energizantes, Monster, Red Bull, Vive 100, Volt, Bang, pre-entreno, preentreno, pastillas de cafeína, cafeína en polvo]
familia: estimulante
identidad:
  quimica: "cafeína (metilxantina); el psicoactivo de mayor consumo en el mundo, presente en café, té, refrescos de cola, bebidas energéticas, algunos medicamentos y productos de cafeína pura en polvo o tabletas"
  fuentes: [cappelletti-muertes-2018, grzegorzewski-pk-2021]
mecanismo:
  texto: "antagonista de los receptores de adenosina e inhibidor de la fosfodiesterasa; se absorbe rápido y casi por completo en el tubo digestivo y se metaboliza casi solo en el hígado por CYP1A2 a paraxantina, teobromina y teofilina"
  limites: "la velocidad con que cada persona la elimina varía mucho (genética de CYP1A2, tabaco, anticonceptivos orales, embarazo, enfermedad hepática, medicamentos); las fuentes leídas no permiten predecir la reacción de una persona concreta"
  fuentes: [austin-tox-cafeina-2024, grzegorzewski-pk-2021, musgrave-forense-2016]
temporalidad:
  - via: oral
    inicio: [5, 30]
    pico: [30, 120]
    duracion: [120, 360]
    fuentes: [mort-presion-2008, psychonautwiki-cafeina]
  - via: intoxicacion-por-ingesta-masiva
    inicio: [120, 240]
    pico: null
    duracion: [1440, 2160]
    fuentes: [austin-tox-cafeina-2024]
efectos:
  - { tipo: fisico, texto: "sube la frecuencia cardiaca y la presión arterial; puede haber palpitaciones, malestar estomacal, náusea y dolor de cabeza", fuentes: [fda-spilling-beans-2024] }
  - { tipo: fisico, texto: "la presión arterial sube entre 3 y 15 mmHg la sistólica y 4 a 13 mmHg la diastólica; el cambio aparece en unos 30 minutos, llega al máximo en 1 a 2 horas y puede durar más de 4; la tolerancia lo atenúa y las personas hipertensas son más susceptibles", fuentes: [mort-presion-2008] }
  - { tipo: emocional, texto: "ansiedad, nerviosismo y temblor (jitters)", fuentes: [fda-spilling-beans-2024, nccih-energeticas-2018] }
  - { tipo: cognitivo, texto: "insomnio o sueño alterado; según EFSA, una toma de 100 mg puede acortar el sueño en algunos adultos si es cerca de la hora de dormir (dato de la fuente)", fuentes: [fda-spilling-beans-2024, efsa-cafeina-2015] }
  - { tipo: fisico, texto: "más ganas de orinar, sed, temblor muscular y mareo aparecen entre los síntomas de exceso", fuentes: [medlineplus-sobredosis-cafeina-2025] }
  - { tipo: fisico, texto: "bebidas energéticas: además de cafeína suelen traer guaraná (otra fuente de cafeína que se suma al total), azúcar, taurina, ginseng, vitaminas B, glucuronolactona y otros; una lata de 16 oz puede traer de 54 a 62 g de azúcar añadida y la etiqueta en EE. UU. no está obligada a declarar la cafeína", fuentes: [nccih-energeticas-2018] }
riesgos:
  - { texto: "cafeína pura o muy concentrada (polvo o líquido): la FDA advierte consecuencias graves, incluida la muerte; un envase a granel puede contener miles de porciones y obliga a la persona a medir una porción a partir de una cantidad tóxica o letal; en 2018 la FDA declaró adulterados ciertos suplementos de cafeína pura o muy concentrada vendidos a granel al consumidor, vinculados a por lo menos dos muertes en EE. UU.; según la FDA, menos de media cucharadita de cafeína pura puede rondar los 1200 mg, cantidad con la que estima efectos tóxicos si se consume rápido (dato de la fuente)", gravedad: grave, fuentes: [fda-spilling-beans-2024, fda-guia-cafeina-concentrada-2018] }
  - { texto: "arritmias: las arritmias ventriculares son la complicación más peligrosa de la intoxicación; las revisiones de casos con bebidas energéticas reportan arritmias supraventriculares y ventriculares, cambios del segmento ST e isquemia, con tres muertes, todas precedidas de arritmia ventricular; en ensayos controlados el hallazgo más constante fue la prolongación del QTc", gravedad: grave, fuentes: [cao-energeticas-ecg-2021, austin-tox-cafeina-2024, medlineplus-sobredosis-cafeina-2025] }
  - { texto: "convulsiones: aparecen en la toxicidad por ingesta rápida de cantidades altas y, en casos graves, la muerte puede venir de convulsiones o de un latido irregular", gravedad: grave, fuentes: [fda-spilling-beans-2024, medlineplus-sobredosis-cafeina-2025, cappelletti-muertes-2018] }
  - { texto: "alteraciones metabólicas en la intoxicación: hipopotasemia (por desplazamiento del potasio al interior de las células, con riesgo de rebote al corregirla), acidosis metabólica con lactato alto, alcalosis respiratoria, glucosa y calcio altos y rabdomiólisis; la toxicidad puede durar 24 a 36 horas tras ingestas grandes", gravedad: grave, fuentes: [austin-tox-cafeina-2024] }
  - { texto: "alcohol con bebida energética: la cafeína puede enmascarar la ebriedad sin mejorar la coordinación ni el tiempo de reacción; quienes los mezclan hacen más atracones de alcohol y reportan más manejo en estado de ebriedad, sexo sin protección y lesiones; en 2011, 42 por ciento de las visitas a urgencias por bebidas energéticas involucraban alcohol u otras drogas", gravedad: moderada, fuentes: [nccih-energeticas-2018, roemer-amed-lesiones-2017] }
  - { texto: "ansiedad y pánico: en personas con trastorno de pánico, cantidades equivalentes a unas cinco tazas de café desencadenaron una crisis de pánico en cerca de la mitad, frente a casi nadie con placebo; también aumenta la ansiedad en adultos sanos a esas cantidades", gravedad: moderada, fuentes: [klevebrant-panico-2022] }
  - { texto: "personas en mayor riesgo: metabolizadores lentos, enfermedad hepática y cardiopatía pueden sufrir daño grave con cantidades muy por debajo de lo que se considera tóxico; las muertes atribuidas solo a cafeína ocurrieron más en lactantes, pacientes psiquiátricos y deportistas; la cafeína puede venir oculta en productos herbales o para bajar de peso que no la declaran", gravedad: moderada, fuentes: [musgrave-forense-2016, cappelletti-muertes-2018] }
  - { texto: "insomnio y deshidratación asociados al consumo alto; en adolescentes el consumo intenso de energéticas se asocia a sueño alterado y más conductas de riesgo", gravedad: leve, fuentes: [fda-spilling-beans-2024, nccih-energeticas-2018] }
senales_de_urgencia:
  - { texto: "latido muy rápido o irregular, palpitaciones que no ceden, o dolor u opresión en el pecho (las fuentes reportan arritmias, isquemia e infarto asociados): buscar atención médica ya", fuentes: [medlineplus-sobredosis-cafeina-2025, cao-energeticas-ecg-2021, austin-tox-cafeina-2024] }
  - { texto: "convulsiones", fuentes: [medlineplus-sobredosis-cafeina-2025, fda-spilling-beans-2024] }
  - { texto: "dificultad para respirar, confusión, alucinaciones, agitación intensa o fiebre", fuentes: [medlineplus-sobredosis-cafeina-2025] }
  - { texto: "vómito que no para tras mucha cafeína, sobre todo si fue cafeína en polvo, líquida concentrada o pastillas: en urgencias se vigila el ritmo cardiaco y el potasio", fuentes: [austin-tox-cafeina-2024, medlineplus-sobredosis-cafeina-2025] }
  - { texto: "al pedir ayuda conviene tener a mano el producto, sus ingredientes, la hora y la cantidad aproximada; no provocar el vómito salvo que lo indique un centro de toxicología o personal de salud", fuentes: [medlineplus-sobredosis-cafeina-2025] }
investigacion:
  - { texto: "revisión sistemática y metaanálisis de 10 estudios ciegos controlados con placebo: 51 por ciento de 237 pacientes con trastorno de pánico tuvo una crisis tras la cafeína y ninguno con placebo; los pacientes fueron mucho más vulnerables que los controles sanos (54 frente a 2 por ciento); límites: rango de cantidades estrecho que no permite curva dosis-respuesta y pocos datos de ansiedad con placebo", tipo: revision, poblacion: "adultos con trastorno de pánico y controles sanos, en laboratorio", fuentes: [klevebrant-panico-2022] }
  - { texto: "revisión narrativa de 32 reportes de caso y 19 ensayos clínicos sobre bebidas energéticas y corazón: arritmias e isquemia en los casos, prolongación del QTc como hallazgo más constante en los ensayos y relación aparente con el volumen consumido; límites: ensayos pequeños con jóvenes sanos, solo efectos agudos, reporte voluntario que subestima eventos y un autor fue perito en litigios sobre estas bebidas", tipo: revision, poblacion: "reportes de caso de 2001 a 2019 y voluntarios jóvenes sanos en ensayos", fuentes: [cao-energeticas-ecg-2021] }
  - { texto: "revisión sistemática (PRISMA) de 92 muertes atribuidas solo a cafeína: ocurrieron más en lactantes, pacientes psiquiátricos y deportistas; concentraciones plasmáticas de 15 mg/L o más se asocian a convulsiones y arritmias y de 80 a 100 mg/L se consideran letales (dato de la fuente); límite: reúne casos publicados, no permite estimar frecuencia", tipo: revision, poblacion: "casos fatales publicados", fuentes: [cappelletti-muertes-2018] }
  - { texto: "revisión sistemática sobre alcohol mezclado con bebidas energéticas: apoya una asociación con más lesiones que el alcohol solo, pero la variabilidad de métodos y desenlaces impide medir cuánto riesgo extra hay", tipo: revision, poblacion: "estudios observacionales en consumidores de alcohol, sobre todo jóvenes", fuentes: [roemer-amed-lesiones-2017] }
  - { texto: "Cochrane sobre restringir cafeína en el embarazo: un solo ensayo aportó datos (1197 mujeres que tomaban 3 o más tazas al día); reducir la cafeína no cambió peso al nacer ni parto prematuro; evidencia de baja calidad, insuficiente para confirmar o descartar efectos", tipo: revision, poblacion: "embarazadas consumidoras habituales de café", fuentes: [jahanfar-cochrane-embarazo-2015] }
fenomenologia:
  - { texto: "testimonio: la estimulación se describe como leve a moderada, más débil que la de anfetamina, MDMA o cocaína, y a cantidades altas como forzada, con mandíbula apretada, temblores y menos control motor; ansiedad, irritabilidad y disforia aparecen sobre todo con mucha cafeína", fuentes: [psychonautwiki-cafeina] }
  - { texto: "testimonio: la bajada se describe con ansiedad, fatiga mental, ánimo bajo, irritabilidad y pensamiento lento, por lo general menos intensa que la de anfetamina o cocaína; la comunidad la atribuye a la adenosina acumulada mientras la cafeína bloqueaba sus receptores, explicación no verificada en las fuentes oficiales leídas", fuentes: [psychonautwiki-cafeina] }
  - { texto: "testimonio: se reportan aceleración del pensamiento, vigilia, sudor, ganas frecuentes de orinar y redosificación compulsiva menos persistente que con nicotina o cocaína", fuentes: [psychonautwiki-cafeina] }
acompanamiento:
  - { texto: "no sumar más cafeína ni otra bebida energética: la FDA asocia la toxicidad al consumo rápido de cantidades altas y la sensibilidad cambia mucho de una persona a otra; la cafeína en polvo o líquida concentrada no se puede medir bien con utensilios de cocina", fuentes: [fda-spilling-beans-2024, fda-guia-cafeina-concentrada-2018] }
  - { texto: "no mezclar con alcohol: la cafeína puede hacer sentir menos ebrio sin devolver la coordinación ni los reflejos; no manejar ni subirse con alguien que tomó", fuentes: [nccih-energeticas-2018] }
  - { texto: "si hay palpitaciones, latido irregular, dolor de pecho, dificultad para respirar o convulsiones, pedir atención médica de inmediato (en México, 911) y tener a la mano el producto, la hora y la cantidad aproximada", fuentes: [medlineplus-sobredosis-cafeina-2025] }
  - { texto: "si es ansiedad o pánico: la cafeína puede desencadenar crisis de pánico, sobre todo en quien ya las ha tenido; nombrarlo como un efecto documentado de la sustancia, no como algo que esté fallando en la persona, mientras no haya señales de urgencia", fuentes: [klevebrant-panico-2022] }
  - { texto: "la norma mexicana obliga a las bebidas adicionadas con cafeína a advertir que no se recomiendan a menores de 12 años, embarazadas o en lactancia, personas sensibles a la cafeína, ni mezcladas con alcohol", fuentes: [nom-218-ssa1-2011] }
contradicciones:
  - { texto: "alcohol: NCCIH dice que la cafeína enmascara la ebriedad y la revisión de Roemer asocia la mezcla a más lesiones; EFSA concluyó que una toma de hasta 200 mg con alcohol cercano a 0.08 por ciento de alcoholemia no cambia la seguridad y que a ese nivel es poco probable que enmascare la percepción de ebriedad", fuentes: [nccih-energeticas-2018, roemer-amed-lesiones-2017, efsa-cafeina-2015] }
  - { texto: "ciprofloxacino: Healy (1989) midió que alarga la vida media de la cafeína de 5.2 a 8.2 horas; la revisión de Grzegorzewski (2021) solo marca precaución con fluvoxamina, ácido pipemídico y norfloxacino", fuentes: [healy-ciprofloxacino-1989, grzegorzewski-pk-2021] }
  - { texto: "límites de referencia distintos según la fuente (datos de la fuente, no recomendaciones): FDA y EFSA hablan de 400 mg al día para adultos sanos no embarazados; EFSA añade 200 mg por toma y 200 mg al día en embarazo; la NOM-218 limita la ingesta diaria que puede venir de bebidas adicionadas con cafeína a 165 mg y su concentración a 33 mg por 100 mL", fuentes: [fda-spilling-beans-2024, efsa-cafeina-2015, nom-218-ssa1-2011] }
  - { texto: "cuánto es peligroso: Cappelletti ubica la muerte en concentraciones plasmáticas muy altas y Musgrave dice que suele requerir gramos; ambos advierten que personas con cardiopatía, enfermedad hepática o metabolismo lento pueden morir con cantidades muy por debajo de lo considerado tóxico", fuentes: [cappelletti-muertes-2018, musgrave-forense-2016] }
  - { texto: "cafeína por bebida energética: NCCIH da 70 a 240 mg por lata de 16 oz; el servicio de toxicología de Austin da 50 a 300 mg por 250 mL", fuentes: [nccih-energeticas-2018, austin-tox-cafeina-2024] }
  - { texto: "duración: la comunidad reporta 2 a 5 horas de efecto; la vida media documentada es de 3 a 6 horas y la presión puede seguir alta más de 4; en intoxicación grave la toxicidad dura 24 a 36 horas", fuentes: [psychonautwiki-cafeina, mort-presion-2008, austin-tox-cafeina-2024] }
  - { texto: "taurina: EFSA concluye que a concentraciones típicas no cambia la seguridad de una toma de cafeína; la revisión de Cao reporta un ensayo en que la taurina sola no explicó los cambios del ECG de las bebidas energéticas, con mecanismo no aclarado", fuentes: [efsa-cafeina-2015, cao-energeticas-ecg-2021] }
