sustancia: cannabis
interacciones:
  - { con: antecedente o predisposición a psicosis, clase: condicion, mecanismo: "asociación epidemiológica, no causalidad demostrada", riesgo: "uso diario asociado con ~3 veces más probabilidad de un primer episodio psicótico y uso diario de alta potencia con ~4 a 5 veces; NASEM concluyó evidencia sustancial de asociación con psicosis", gravedad: grave, evidencia: media, fuentes: [di-forti-2019, nasem-2017] }
  - { con: enfermedad cardiovascular, clase: condicion, mecanismo: "no detallado en las fuentes leídas", riesgo: "la American Heart Association concluyó que los posibles riesgos cardiovasculares superan a los posibles beneficios", gravedad: grave, evidencia: media, fuentes: [aha-2020] }
  - { con: alcohol, clase: sustancia, mecanismo: "suma de deterioro psicomotor", riesgo: "mezclarlo con alcohol aumenta el deterioro de reacción y coordinación", gravedad: moderada, evidencia: media, fuentes: [cdc-health-effects-2024] }
  - { con: embarazo, clase: condicion, mecanismo: "no establecido", riesgo: "evidencia sustancial de asociación entre fumar cannabis en el embarazo y menor peso al nacer", gravedad: moderada, evidencia: media, fuentes: [nasem-2017] }
fuentes:
