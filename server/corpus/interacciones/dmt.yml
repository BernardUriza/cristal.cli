sustancia: dmt
interacciones:
  - { con: "ISRS y otros antidepresivos serotoninérgicos (ayahuasca)", clase: medicamento, mecanismo: "los alcaloides de la harmala inhiben la MAO; con un ISRS la serotonina puede subir hasta toxicidad", riesgo: "posible síndrome serotoninérgico grave; la alerta original se basó en tres casos, todos con ISRS", gravedad: grave, evidencia: reportes-de-caso, fuentes: [callaway-grob-1998, malcolm-thomas-2021] }
  - { con: "IMAO farmacológicos (ayahuasca)", clase: medicamento, mecanismo: "suma de inhibición de MAO", riesgo: "toxicidad serotoninérgica; las revisiones recomiendan evitar ayahuasca con antidepresivos y fármacos serotoninérgicos", gravedad: grave, evidencia: baja, fuentes: [malcolm-thomas-2021, chacruna-ss-2021] }
  - { con: "tramadol (ayahuasca)", clase: medicamento, mecanismo: "inferencia: la ficha de tramadol advierte síndrome serotoninérgico y convulsiones con IMAO; la harmala inhibe MAO; sin caso publicado", riesgo: "síndrome serotoninérgico y convulsiones, potencialmente mortal", gravedad: grave, evidencia: baja, fuentes: [ultram-fda-2023, malcolm-thomas-2021] }
  - { con: "MDMA (ayahuasca)", clase: sustancia, mecanismo: "inferencia: la MDMA libera serotonina y con IMAO tiene el riesgo más alto de toxicidad serotoninérgica", riesgo: "síndrome serotoninérgico; con IMAO farmacológicos hay casos graves e incluso muertes", gravedad: grave, evidencia: baja, fuentes: [chacruna-ss-2021, sarparast-2022-chacruna] }
  - { con: "estimulantes (metanfetamina, anfetamina, MDMA)", clase: sustancia, mecanismo: "suma simpaticomimética y serotoninérgica", riesgo: "un caso de paro cardiorrespiratorio tras mezcla de varias sustancias; no atribuible a una interacción concreta", gravedad: grave, evidencia: reportes-de-caso, fuentes: [freidel-2024] }
