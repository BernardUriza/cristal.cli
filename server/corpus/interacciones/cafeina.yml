sustancia: cafeina
interacciones:
  - { con: "alcohol", clase: sustancia, mecanismo: "la cafeína puede enmascarar la sensación de ebriedad sin mejorar la coordinación ni el tiempo de reacción", riesgo: "más atracones, manejo en estado de ebriedad, sexo sin protección y lesiones; asociación con más lesiones que el alcohol solo, de tamaño no medible; EFSA no halló cambio de seguridad con 200 mg y alcoholemia cercana a 0.08 por ciento", gravedad: moderada, evidencia: media, fuentes: [nccih-energeticas-2018, roemer-amed-lesiones-2017, efsa-cafeina-2015] }
  - { con: "MDMA (éxtasis, tachas)", clase: sustancia, mecanismo: "la MDMA aumenta la liberación de dopamina y la cafeína antagoniza la adenosina e inhibe la fosfodiesterasa; altera la regulación de la temperatura, suma cardiotoxicidad y baja el umbral de convulsiones", riesgo: "en ratas la cafeína agrava mucho la toxicidad aguda de la MDMA (temperatura corporal alta, taquicardia y más mortalidad) y su neurotoxicidad serotoninérgica; en humanos, una de las tres muertes de la revisión de casos con bebidas energéticas involucró MDMA; la cafeína también aparece como adulterante de lo vendido como MDMA", gravedad: grave, evidencia: baja, fuentes: [vanattou-mdma-cafeina-2012, cao-energeticas-ecg-2021, msd-mdma-2026] }
  - { con: "anfetaminas, cocaína y estimulantes de receta", clase: sustancia, mecanismo: "mecanismos parecidos a los de la MDMA (adenosina, fosfodiesterasa, dopamina); efectos cardiovasculares que se suman", riesgo: "la revisión describe interacciones adversas de la cafeína con cocaína, d-anfetamina y efedrina; en perros, cafeína antes de cocaína produjo efectos excitatorios cardiovasculares sinérgicos y menor reserva coronaria; para estimulantes de receta no se encontró estudio humano: inferencia por mecanismo", gravedad: moderada, evidencia: baja, fuentes: [vanattou-mdma-cafeina-2012, mehta-cocaina-cafeina-2004] }
  - { con: fluvoxamina, clase: medicamento, mecanismo: "inhibe CYP1A2, la enzima que elimina la cafeína", riesgo: "en voluntarios sanos redujo muchísimo la depuración de cafeína y alargó su vida media, sin cambios medibles en sus efectos tras una sola toma; los autores no descartan efectos adversos por acumulación con consumo diario; la revisión de farmacocinética la señala como una de las pocas combinaciones que piden precaución", gravedad: moderada, evidencia: media, fuentes: [culm-merdek-fluvoxamina-2005, grzegorzewski-pk-2021] }
  - { con: ciprofloxacino, clase: medicamento, mecanismo: "retrasa la conversión de cafeína a paraxantina (CYP1A2) y baja su depuración", riesgo: "en 10 voluntarios la vida media de la cafeína subió de 5.2 a 8.2 horas; los autores dicen que la relevancia clínica no está determinada; la revisión de 2021 no lo incluye entre las combinaciones de precaución (sí al norfloxacino)", gravedad: leve, evidencia: media, fuentes: [healy-ciprofloxacino-1989, grzegorzewski-pk-2021] }
  - { con: "cardiopatía, arritmias o hipertensión", clase: condicion, mecanismo: "sube frecuencia cardiaca y presión; puede prolongar el QTc", riesgo: "personas con cardiopatía pueden sufrir daño grave con cantidades por debajo de lo considerado tóxico; las hipertensas son más susceptibles a la subida de presión; NCCIH advierte trastornos del ritmo con cantidades grandes", gravedad: grave, evidencia: media, fuentes: [musgrave-forense-2016, mort-presion-2008, nccih-energeticas-2018, cao-energeticas-ecg-2021] }
  - { con: embarazo y lactancia, clase: condicion, mecanismo: "el embarazo cambia la farmacocinética de la cafeína", riesgo: "EFSA da 200 mg al día como referencia en embarazo (dato de la fuente); la NOM-218 obliga a advertir que las bebidas con cafeína no se recomiendan en embarazo ni lactancia; Cochrane halla evidencia insuficiente para confirmar o descartar efectos de restringirla", gravedad: desconocida, evidencia: baja, fuentes: [efsa-cafeina-2015, nom-218-ssa1-2011, jahanfar-cochrane-embarazo-2015, grzegorzewski-pk-2021] }
  - { con: "trastorno de pánico o de ansiedad", clase: condicion, mecanismo: "efecto ansiógeno y panicógeno de la cafeína", riesgo: "a cantidades altas desencadenó crisis de pánico en cerca de la mitad de los pacientes con trastorno de pánico frente a casi ninguno de los controles", gravedad: moderada, evidencia: alta, fuentes: [klevebrant-panico-2022] }
