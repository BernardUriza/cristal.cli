sustancia: lsd
interacciones:
  - { con: litio, clase: medicamento, mecanismo: "no establecido; la señal viene de informes autorreportados", riesgo: "convulsiones: 47% de 62 informes de litio con psicodélicos clásicos incluyeron convulsiones y 39% buscó atención médica; la lamotrigina no mostró la señal", gravedad: grave, evidencia: reportes-de-caso, fuentes: [nayak-2021, sarparast-2022-chacruna] }
  - { con: antidepresivos tricíclicos, clase: medicamento, mecanismo: "no establecido; encuesta retrospectiva", riesgo: "en 10 personas, quienes usaban tricíclicos refirieron respuestas físicas, alucinatorias y psicológicas aumentadas; muestra mínima y autorreporte", gravedad: desconocida, evidencia: baja, fuentes: [bonson-1996] }
  - { con: "ISRS (fluoxetina, paroxetina, sertralina)", clase: medicamento, mecanismo: "uso crónico de ISRS se asocia a menor respuesta subjetiva; la toxicidad serotoninérgica con psicodélicos clásicos se considera de riesgo bajo", riesgo: "efecto atenuado; hay un caso aislado de convulsión en un adolescente con fluoxetina y LSD, sin causalidad establecida", gravedad: desconocida, evidencia: baja, fuentes: [bonson-1996, freidel-2024, malcolm-thomas-2021] }
  - { con: "IMAO (fenelzina, tranilcipromina, moclobemida)", clase: medicamento, mecanismo: "los IMAO impiden degradar serotonina", riesgo: "las combinaciones con IMAO elevan sustancialmente el riesgo de toxicidad serotoninérgica y deben evitarse", gravedad: grave, evidencia: baja, fuentes: [malcolm-thomas-2021, chacruna-ss-2021] }
  - { con: "estimulantes (metanfetamina, anfetamina, MDMA)", clase: sustancia, mecanismo: "suma de efectos simpaticomiméticos y serotoninérgicos", riesgo: "un caso publicado de paro cardiorrespiratorio tras mezcla de varias sustancias; no atribuible a una interacción concreta", gravedad: grave, evidencia: reportes-de-caso, fuentes: [freidel-2024] }
  - { con: epilepsia o antecedente de convulsiones, clase: condicion, mecanismo: "no establecido", riesgo: "los datos sobre psicodélicos y convulsiones son escasos y conflictivos; no permiten descartar riesgo", gravedad: desconocida, evidencia: baja, fuentes: [freidel-2024] }
