sustancia: mdma
interacciones:
  - { con: "IMAO (fenelzina, tranilcipromina, moclobemida)", clase: medicamento, mecanismo: "la MDMA libera serotonina y con un IMAO no se degrada", riesgo: "síndrome serotoninérgico raro pero potencialmente letal; hay muertes reportadas; la combinación de mayor riesgo", gravedad: grave, evidencia: reportes-de-caso, fuentes: [sarparast-2022-chacruna, chacruna-ss-2021] }
  - { con: "ISRS e ISRN (fluoxetina, paroxetina, otros)", clase: medicamento, mecanismo: "bloqueo del transportador de serotonina; fluoxetina y paroxetina además elevan los niveles de MDMA", riesgo: "efectos atenuados (24 estudios); toxicidad serotoninérgica considerada baja en ensayos controlados", gravedad: moderada, evidencia: media, fuentes: [sarparast-2022-chacruna, chacruna-ss-2021] }
  - { con: "ritonavir (inhibidor de CYP2D6)", clase: medicamento, mecanismo: "la MDMA se metaboliza por CYP2D6; inhibirlo puede elevar sus niveles", riesgo: "un caso fatal publicado (Lancet 1999) con niveles muy superiores a lo esperado; causalidad como hipótesis de los autores", gravedad: grave, evidencia: reportes-de-caso, fuentes: [henry-hill-1999, statpearls-mdma-2024] }
  - { con: tramadol, clase: medicamento, mecanismo: "inferencia: la ficha advierte síndrome serotoninérgico y convulsiones con serotoninérgicos; sin caso publicado de la combinación", riesgo: "síndrome serotoninérgico y convulsiones, potencialmente mortales", gravedad: grave, evidencia: baja, fuentes: [ultram-fda-2023, statpearls-mdma-2024] }
  - { con: "estimulantes (anfetaminas, cocaína)", clase: sustancia, mecanismo: "efectos cardiovasculares adrenérgicos sumados", riesgo: "taquicardia, hipertensión, arritmias, infarto, disección aórtica y hemorragia intracraneal entre las complicaciones", gravedad: grave, evidencia: baja, fuentes: [statpearls-mdma-2024, freidel-2024] }
  - { con: alcohol, clase: sustancia, mecanismo: "se suma a la deshidratación y aumenta el riesgo de hipertermia", riesgo: "más riesgo de hipertermia y deshidratación; dos reportes de convulsiones con MDMA y alcohol", gravedad: moderada, evidencia: media, fuentes: [vanamsterdam-alcohol-2021, freidel-2024] }
  - { con: "calor, esfuerzo prolongado y beber agua en exceso", clase: condicion, mecanismo: "la MDMA libera vasopresina y retiene agua; con sudor y mucha agua sola baja el sodio", riesgo: "hiponatremia con convulsiones, coma y edema cerebral; hipertermia sobre 40 °C pone en riesgo la vida", gravedad: grave, evidencia: media, fuentes: [statpearls-mdma-2024, elkattawy-2021] }
  - { con: cardiopatía o hipertensión, clase: condicion, mecanismo: "sube presión y frecuencia por aumento de noradrenalina", riesgo: "infarto, arritmias, disección aórtica y hemorragia intracraneal entre las complicaciones", gravedad: grave, evidencia: media, fuentes: [statpearls-mdma-2024] }
  - { con: epilepsia o antecedente de convulsiones, clase: condicion, mecanismo: "las convulsiones con MDMA se atribuyen sobre todo a hiponatremia e hipertermia", riesgo: "datos escasos; no permiten descartar riesgo", gravedad: desconocida, evidencia: baja, fuentes: [freidel-2024, elkattawy-2021] }
  - { con: "cafeína y bebidas energéticas", clase: sustancia, mecanismo: "la MDMA aumenta la liberación de dopamina y la cafeína antagoniza la adenosina e inhibe la fosfodiesterasa; altera la regulación de la temperatura, suma cardiotoxicidad y baja el umbral de convulsiones", riesgo: "en ratas la cafeína agrava mucho la toxicidad aguda de la MDMA (temperatura corporal alta, taquicardia y más mortalidad) y su neurotoxicidad serotoninérgica; en humanos, una de las tres muertes de una revisión de casos con bebidas energéticas involucró MDMA", gravedad: grave, evidencia: baja, fuentes: [vanattou-mdma-cafeina-2012, cao-energeticas-ecg-2021] }
