sustancia: ketamina
interacciones:
  - { con: alcohol, clase: sustancia, mecanismo: "suma de depresión del sistema nervioso central", riesgo: "más sedación y riesgo cardiopulmonar; 71.5% de las visitas a urgencias por ketamina en EE. UU. en 2011 involucraron alcohol", gravedad: grave, evidencia: media, fuentes: [statpearls-ketamina-2023, spravato-fda-2025] }
  - { con: benzodiacepinas, clase: medicamento, mecanismo: "suma de depresión del SNC", riesgo: "más sedación; la ficha de esketamina pide vigilar la sedación", gravedad: moderada, evidencia: alta, fuentes: [spravato-fda-2025, statpearls-ketamina-2023] }
  - { con: "opioides (incluido tramadol)", clase: medicamento, mecanismo: "suma de depresión del SNC", riesgo: "más sedación y riesgo respiratorio", gravedad: grave, evidencia: alta, fuentes: [spravato-fda-2025, statpearls-ketamina-2023] }
  - { con: "estimulantes (anfetaminas, metilfenidato, MDMA, cocaína)", clase: sustancia, mecanismo: "la ketamina sube presión y pulso; los estimulantes suman", riesgo: "los psicoestimulantes pueden aumentar la presión arterial; la mezcla es frecuente", gravedad: moderada, evidencia: alta, fuentes: [spravato-fda-2025, statpearls-ketamina-2023] }
