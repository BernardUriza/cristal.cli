  - { con: hipertensión o enfermedad cardiovascular grave, clase: condicion, mecanismo: "taquicardia e hipertensión frecuentes con ketamina", riesgo: "mayor riesgo de ictus en enfermedad cardiovascular grave o hipertensión", gravedad: grave, evidencia: media, fuentes: [statpearls-ketamina-2023, spravato-fda-2025] }
