sustancia: psilocibina
interacciones:
  - { con: litio, clase: medicamento, mecanismo: "no establecido; informes autorreportados", riesgo: "convulsiones; evidencia baja, pero es la señal más consistente para psicodélicos clásicos", gravedad: grave, evidencia: reportes-de-caso, fuentes: [nayak-2021, sarparast-2022-chacruna] }
  - { con: "ISRS (escitalopram)", clase: medicamento, mecanismo: "dos semanas de escitalopram no atenuaron los efectos en un ensayo controlado (pretratamiento probablemente corto)", riesgo: "riesgo de seguridad mínimo en el ensayo; la toxicidad serotoninérgica con psicodélicos clásicos se considera baja", gravedad: leve, evidencia: media, fuentes: [sarparast-2022-chacruna, malcolm-thomas-2021] }
  - { con: "IMAO (fenelzina, tranilcipromina, moclobemida)", clase: medicamento, mecanismo: "riesgo teórico de toxicidad serotoninérgica", riesgo: "no hay síndrome serotoninérgico documentado con psilocibina e IMAO, pero la revisión de toxicidad indica evitar combinaciones con IMAO", gravedad: desconocida, evidencia: baja, fuentes: [sarparast-2022-chacruna, malcolm-thomas-2021] }
  - { con: "antipsicóticos (risperidona, haloperidol)", clase: medicamento, mecanismo: "la risperidona (antagonista 5-HT2A) bloquea los efectos; el haloperidol (antagonista dopaminérgico) los aumentó", riesgo: "con haloperidol los efectos psicotomiméticos aumentaron; ensayo en voluntarios sanos", gravedad: moderada, evidencia: media, fuentes: [vollenweider-1998] }
  - { con: cardiopatía o hipertensión, clase: condicion, mecanismo: "eleva la presión arterial y la frecuencia cardiaca", riesgo: "NIDA advierte que puede ser peligroso en personas con enfermedades del corazón", gravedad: moderada, evidencia: media, fuentes: [nida-psilocibina-2024] }
  - { con: epilepsia o antecedente de convulsiones, clase: condicion, mecanismo: "no establecido", riesgo: "datos escasos y contradictorios; no se puede descartar riesgo", gravedad: desconocida, evidencia: baja, fuentes: [freidel-2024] }
  - { con: embarazo, clase: condicion, mecanismo: "sin datos", riesgo: "NIDA indica que no hay datos de seguridad durante el embarazo", gravedad: desconocida, evidencia: baja, fuentes: [nida-psilocibina-2024] }
